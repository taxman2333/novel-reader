<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!--
    书页之间 — 应用图标（定稿）
    设计说明见 design/app-icon/README.md

    底色 #586a51  界面主按钮色，也是提示条颜色
    书身 #f4f0e7  由默认主题暖纸底 #f1ede4 与主按钮文字色 #fffdf8 之间取得
  -->
  <rect width="256" height="256" rx="56" fill="#586a51"/>

  <!-- 摊开的书：书页自左右两侧向中缝下沉，下缘平直。
       画成一整块而不是两页拼接，是为了缩小到 16×16 时不会散成两个方块 ——
       两页之间只有中缝这一条线，它在大尺寸下交代结构，小尺寸下自然消失。 -->
  <path d="M60 66Q92 66 126 94L130 94Q164 66 196 66A14 14 0 0 1 210 80V182A14 14 0 0 1 196 196H64A14 14 0 0 1 50 182V80A14 14 0 0 1 60 66Z"
        fill="#f4f0e7"/>

  <!-- 中缝 -->
  <path d="M128 94V196" stroke="#586a51" stroke-width="9"/>
</svg>
