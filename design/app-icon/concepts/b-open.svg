<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- 底色：界面主按钮色 #586a51 -->
  <rect width="256" height="256" rx="56" fill="#586a51"/>
  <!-- 摊开的书：书页自两侧向中缝下沉（上缘中间凹），下缘平直，整体一块书体。
       画成单块而不是两页，是为了缩小到 16×16 时不会散成两个方块 -->
  <path d="M60 66Q92 66 126 94L130 94Q164 66 196 66A14 14 0 0 1 210 80V182A14 14 0 0 1 196 196H64A14 14 0 0 1 50 182V80A14 14 0 0 1 60 66Z" fill="#f4f0e7"/>
  <!-- 中缝：底色竖线，从上缘凹口落到下缘 -->
  <path d="M128 94V196" stroke="#586a51" stroke-width="8"/>
</svg>
