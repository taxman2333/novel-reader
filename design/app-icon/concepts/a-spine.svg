       沿用界面 .book-spine 的 border-radius: 3px 6px 6px 3px -->
  <path d="M76 50H170A16 16 0 0 1 186 66V190A16 16 0 0 1 170 206H76A6 6 0 0 1 70 200V56A6 6 0 0 1 76 50Z" fill="#f4f0e7"/>
